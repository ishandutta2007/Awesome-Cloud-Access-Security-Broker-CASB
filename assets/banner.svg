<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      @keyframes float1 {
        0%, 100% { transform: translateY(0px) scale(1); opacity: 0.4; }
        50% { transform: translateY(-15px) scale(1.08); opacity: 0.7; }
      }
      @keyframes float2 {
        0%, 100% { transform: translateY(0px) scale(1); opacity: 0.3; }
        50% { transform: translateY(12px) scale(0.95); opacity: 0.6; }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.2; }
        50% { opacity: 0.5; }
      }
      .node1 { animation: float1 6s ease-in-out infinite; }
      .node2 { animation: float2 8s ease-in-out infinite; }
      .bg-pulse { animation: pulseGlow 4s ease-in-out infinite; }
      .title-text { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 36px; fill: url(#textGrad); }
      .subtitle-text { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 400; font-size: 18px; fill: #94a3b8; }
      .badge-text { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 600; fill: #e2e8f0; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="350" rx="16" fill="url(#bg)" />

  <!-- Animated background elements -->
  <circle cx="1000" cy="80" r="180" fill="#6366f1" class="bg-pulse" filter="blur(40px)" />
  <circle cx="150" cy="280" r="140" fill="#0ea5e9" class="bg-pulse" filter="blur(50px)" />

  <!-- Dynamic floating connection network nodes -->
  <g class="node1">
    <circle cx="920" cy="120" r="6" fill="#38bdf8" />
    <circle cx="1050" cy="180" r="8" fill="#818cf8" />
    <circle cx="980" cy="260" r="5" fill="#c084fc" />
    <line x1="920" y1="120" x2="1050" y2="180" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4,4" opacity="0.4" />
    <line x1="1050" y1="180" x2="980" y2="260" stroke="#818cf8" stroke-width="1" stroke-dasharray="4,4" opacity="0.4" />
  </g>
  <g class="node2">
    <circle cx="150" cy="90" r="7" fill="#818cf8" />
    <circle cx="240" cy="150" r="5" fill="#38bdf8" />
    <line x1="150" y1="90" x2="240" y2="150" stroke="#6366f1" stroke-width="1" stroke-dasharray="4,4" opacity="0.3" />
  </g>

  <!-- Shield Icon Graphic -->
  <g transform="translate(70, 105)">
    <rect x="0" y="0" width="70" height="70" rx="16" fill="url(#accentGrad)" opacity="0.2" />
    <path d="M35 12 L15 22 V38 C15 50 23.5 61 35 64 C46.5 61 55 50 55 38 V22 Z" fill="none" stroke="url(#textGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M28 36 L33 41 L42 30" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Foreground Content -->
  <text x="165" y="138" class="title-text">Awesome Cloud Access Security Broker (CASB)</text>
  <text x="165" y="172" class="subtitle-text">Curated SaaS Platforms, Open-Source Projects, Shadow IT &amp; DLP Security Tools</text>

  <!-- Feature Pills / Badges in Foreground -->
  <g transform="translate(165, 210)">
    <rect x="0" y="0" width="150" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="16" cy="16" r="5" fill="#10b981" />
    <text x="30" y="21" class="badge-text">Shadow IT Discovery</text>

    <rect x="162" y="0" width="165" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="178" cy="16" r="5" fill="#3b82f6" />
    <text x="192" y="21" class="badge-text">Data Loss Prevention</text>

    <rect x="339" y="0" width="155" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="355" cy="16" r="5" fill="#8b5cf6" />
    <text x="369" y="21" class="badge-text">SSPM &amp; Compliance</text>

    <rect x="506" y="0" width="155" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="522" cy="16" r="5" fill="#f59e0b" />
    <text x="536" y="21" class="badge-text">Open Source &amp; SaaS</text>
  </g>
</svg>
